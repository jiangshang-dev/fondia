server:
  port: 7006

spring:
  application:
    name: jeecg-support
  cloud:
    nacos:
      config:
        server-addr: @config.server-addr@
        group: @config.group@
        namespace: @config.namespace@
        username: @config.username@
        password: @config.password@
      discovery:
        server-addr: ${spring.cloud.nacos.config.server-addr}
        group: @config.group@
        namespace: @config.namespace@
        username: @config.username@
        password: @config.password@
  config:
    import:
      - optional:nacos:jeecg.yaml
      - optional:nacos:jeecg-@profile.name@.yaml

jeecg:
  support:
    ai-service-name: jeecg-system
    # 开发环境若 Nacos 服务发现失败，直连 jeecg-system（同机部署用 127.0.0.1:7001）
    ai-chat-base-url: http://127.0.0.1:7001
