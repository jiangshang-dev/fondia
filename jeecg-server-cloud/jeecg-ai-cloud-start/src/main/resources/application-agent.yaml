fondia:
  agentscope:
    llm:
      base-url: ${LLM_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      model-name: ${LLM_MODEL_NAME:qwen3.8-max}
      api-key: ${LLM_API_KEY:sk-sp-H.XMLRH.Y6F9.MEUCIEAtQ0KSpVo5OwewjAnhy2YIESrnbBxmDXpZ9sxlN5MHAiEAzVX9zCHyiRgSn8KbOL7zlwrolV6MdsYmcEbazO3FS1U}
      stream: true
    agent-name: assistant
    workspace: ${AGENTSCOPE_WORKSPACE:./.fondiaAgent}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      key-prefix: ${REDIS_KEY_PREFIX:agentscope-fondia:session:}
    memory:
      compaction-enabled: ${COMPACTION_ENABLED:true}
      # 常规多轮咨询无需频繁调用小模型压缩；避免压缩阻塞主模型首个流式片段。
      compaction-trigger-messages: ${COMPACTION_TRIGGER_MESSAGES:30}
      compaction-keep-messages: ${COMPACTION_KEEP_MESSAGES:5}
      # 开启小模型压缩
      smallModelEnabled: true
      # 开启主编排 + 子 Agent 委派（agent_spawn）
      subagent-eable: true
      compactionModelName: qwen/qwen3-1.7b
      compactionModelBaseUrl: http://192.168.1.88:1234
      compactionModelApiKey: sk-d3580966983048d99b53a77fc67e8372
    # 主 Agent 系统提示词：正文在 Nacos Data Id = agent-system-message.txt
    system:
      chat:
        data-id: agent-system-message.txt
        group: DEFAULT_GROUP
        timeout-ms: 20000
