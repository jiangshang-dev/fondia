# 邮件配置示例
# 复制此配置到项目的配置文件中，并填入实际配置信息

spring:
  mail:
    # 邮件服务器地址
    host: smtp.example.com
    # 邮件服务器端口
    port: 587
    # 发件人邮箱
    username: your-email@example.com
    # 发件人邮箱密码或授权码
    password: your-password
    # 邮件协议
    protocol: smtp
    # 是否开启认证
    properties:
      mail:
        smtp:
          auth: true
          # 是否开启SSL加密
          ssl:
            enable: false
          # 是否开启STARTTLS加密
          starttls:
            enable: true
            required: true
        # 邮件发送超时时间（毫秒）
        debug: false
    # 默认发件人
    default-encoding: UTF-8

# Hutool 邮箱配置
hutool:
  mail:
    # 发件人邮箱
    from: your-email@example.com
    # 是否需要认证
    auth: true
    # 邮件服务器地址
    host: smtp.example.com
    # 邮件服务器端口
    port: 587
    # 发件人邮箱
    user: your-email@example.com
    # 发件人邮箱密码或授权码
    pass: your-password
    # 是否开启SSL加密
    sslEnable: false
    # 是否开启STARTTLS加密
    starttlsEnable: true
